name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python3 -m unittest discover -s tests -v
      - run: bash bundle.sh
      - run: git diff --exit-code -- dist
      - run: git diff --check
